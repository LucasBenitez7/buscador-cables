# Servicios para desarrollo local. No se usa en producción.
name: buscador-cables

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cables
      POSTGRES_PASSWORD: cables
      POSTGRES_DB: cables
    ports:
      # 5433 en el host para no chocar con otros Postgres locales
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cables -d cables"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interfaz web: http://localhost:8025

volumes:
  postgres-data:
