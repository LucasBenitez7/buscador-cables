packages:
  - "apps/*"
  - "packages/*"

# Parches de seguridad en dependencias transitivas (herramientas de desarrollo).
# minimatch 7-11.0.0: DoS por amplificación de globparts (GHSA, Dependabot #2). Sin parche en 10.x.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Avisos de `pnpm audit` revisados y aceptados (el CI falla con cualquier otro de gravedad alta).
# Quitar cada uno en cuanto haya versión arreglada.
auditConfig:
  ignoreGhsas:
    # picomatch: ReDoS con extglobs repetidos (2026-11-17). Sin versión arreglada. Llega por
    # better-auth > vitest (herramienta de tests); la web no lo usa al atender peticiones.
    - GHSA-fc5q-39xc-vjpf
