version: 2

updates:
  - package-ecosystem: npm
    # Solo la raíz: ahí están pnpm-workspace.yaml y el único pnpm-lock.yaml. Desde la raíz,
    # Dependabot actualiza los package.json de cada paquete y el lockfile a la vez. Con
    # "/apps/*" y "/packages/*" cambiaba el package.json sin el lockfile y el CI fallaba.
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # "chore(deps): bump …", válido para commitlint (el scope "deps" está permitido).
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    ignore:
      # Los tipos de Node siguen a la versión de Node del proyecto (24, ver package.json y CI).
      # Se suben a mano cuando se cambie de Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Menores y parches de todo el monorepo juntos en un PR.
      npm-minor-patch:
        update-types: [minor, patch]
      # ESLint y sus piezas cambian de versión mayor a la vez: un único PR para todas.
      eslint-major:
        update-types: [major]
        patterns: ["eslint", "@eslint/*", "eslint-*", "typescript-eslint", "@typescript-eslint/*"]
      # Cualquier otra versión mayor va en su propio PR, que cubre todo el monorepo.

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
