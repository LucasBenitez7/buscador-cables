version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # "chore(deps): bump …", válido para commitlint (el scope "deps" está permitido).
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    groups:
      # Menores y parches juntos en un PR; las versiones mayores van una a una.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
