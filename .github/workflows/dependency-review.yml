name: Revisión de dependencias

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Falla si el PR añade o actualiza una dependencia con una vulnerabilidad alta o crítica
      # conocida. Las vulnerabilidades que ya estaban antes del PR las vigila Dependabot.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
