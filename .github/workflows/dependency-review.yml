name: Revisión de dependencias

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Falla si el PR añade o actualiza una dependencia con una vulnerabilidad alta o crítica
      # conocida. Las vulnerabilidades que ya estaban antes del PR las vigila Dependabot.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
