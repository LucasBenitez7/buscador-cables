name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  check:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cables
          POSTGRES_PASSWORD: cables
          POSTGRES_DB: cables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cables -d cables"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cables:cables@localhost:5432/cables?schema=public
      DATABASE_URL_TEST: postgresql://cables:cables@localhost:5432/cables_test?schema=public
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Preparar bases de datos
        run: |
          export PGPASSWORD=cables
          psql -h localhost -U cables -d postgres -c "CREATE DATABASE cables_test OWNER cables;"
          psql -h localhost -U cables -d cables -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U cables -d cables_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios y de integración
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    # Los E2E solo se ejecutan al integrar en dev/main, no en cada rama feat/*.
    # Ver "Política de E2E" en CONTRIBUTING.md.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cables
          POSTGRES_PASSWORD: cables
          POSTGRES_DB: cables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cables -d cables"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cables:cables@localhost:5432/cables?schema=public
      DATABASE_URL_TEST: postgresql://cables:cables@localhost:5432/cables_test?schema=public
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Preparar base de datos
        run: |
          export PGPASSWORD=cables
          psql -h localhost -U cables -d cables -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Instalar navegadores
        run: pnpm --filter @cables/web exec playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        run: pnpm test:e2e

      - name: Subir informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
