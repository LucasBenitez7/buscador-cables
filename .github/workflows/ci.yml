name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Mínimo privilegio: el token del workflow solo puede leer el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En un PR, un push nuevo cancela la ejecución anterior. En dev/main cada merge se comprueba entero.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  # La versión de pnpm sale de "packageManager" en package.json (pnpm/action-setup la lee de ahí).

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cables
          POSTGRES_PASSWORD: cables
          POSTGRES_DB: cables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cables -d cables"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cables:cables@localhost:5432/cables?schema=public
      DATABASE_URL_TEST: postgresql://cables:cables@localhost:5432/cables_test?schema=public
      APP_URL: http://localhost:3000
      # Secreto solo para CI (no protege datos reales). Nunca reutilizar fuera de aquí.
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Caché de Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Caché de Next.js
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Preparar bases de datos
        run: |
          export PGPASSWORD=cables
          psql -h localhost -U cables -d postgres -c "CREATE DATABASE cables_test OWNER cables;"
          psql -h localhost -U cables -d cables -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U cables -d cables_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Formato
        run: pnpm format:check

      - name: Migraciones al día con el esquema
        run: |
          pnpm db:deploy
          pnpm db:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios y de integración (con umbral de cobertura)
        run: pnpm test

      - name: Build
        run: pnpm build

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Commits del PR en Conventional Commits
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Los E2E empiezan en la fase 6. Hasta entonces este job solo se lanza a mano
    # (Actions → CI → Run workflow). Ver "Política de E2E" en CONTRIBUTING.md.
    if: github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cables
          POSTGRES_PASSWORD: cables
          POSTGRES_DB: cables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cables -d cables"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cables:cables@localhost:5432/cables?schema=public
      DATABASE_URL_TEST: postgresql://cables:cables@localhost:5432/cables_test?schema=public
      APP_URL: http://localhost:3000
      # Secreto solo para CI (no protege datos reales). Nunca reutilizar fuera de aquí.
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Preparar base de datos
        run: |
          export PGPASSWORD=cables
          psql -h localhost -U cables -d cables -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Instalar navegadores
        run: pnpm --filter @cables/web exec playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        run: pnpm test:e2e

      - name: Subir informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
